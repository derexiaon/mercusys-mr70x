name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      variants:
        description: Что собрать
        type: choice
        options:
          - один вариант (по галочкам ниже)
          - все стандартные варианты
        default: один вариант (по галочкам ниже)
      awg:
        description: AmneziaWG
        type: boolean
        default: false
      proton:
        description: Тема LuCI Proton2025
        type: boolean
        default: false
      apk:
        description: Пакетный менеджер apk (отключает mklibs, свободного места меньше)
        type: boolean
        default: false
      release_tag:
        description: Опубликовать релиз с этим тегом (например v25.12.5-3), пусто — без релиза
        default: ''
      openwrt_version:
        description: Версия OpenWrt
        default: '25.12.5'
      xray_version:
        description: Тег Xray-core
        default: 'v26.3.27'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: ${{ inputs.openwrt_version || '25.12.5' }}
  XRAY_VERSION: ${{ inputs.xray_version || 'v26.3.27' }}
  # IMAGE_SIZE of mercusys_mr70x-v1 in target/linux/ramips/image/mt7621.mk
  FIRMWARE_LIMIT: 16121856

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - name: Select variants
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${{ inputs.variants }}" != "все стандартные варианты" ]; then
            echo "${{ inputs.awg && '1' || '0' }} ${{ inputs.apk && '1' || '0' }} ${{ inputs.proton && '1' || '0' }}" > variants.txt
          else
            grep -v '^#' openwrt/standard-variants > variants.txt
          fi
          while read -r a p t; do echo "$(sh openwrt/variant.sh name $a $p $t)  (awg=$a apk=$p proton=$t)"; done < variants.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            rsync swig unzip zlib1g-dev file wget xsltproc zstd qemu-user-static >/dev/null

      - name: Fetch Xray-core ${{ env.XRAY_VERSION }}
        run: git clone --depth 1 -b "$XRAY_VERSION" https://github.com/XTLS/Xray-core.git xray-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: xray-src/go.mod
          cache-dependency-path: xray-src/go.sum

      - name: Build slim Xray (mipsle softfloat)
        run: |
          set -o pipefail
          bash xray-slim/build.sh "$XRAY_VERSION" files/usr/bin/xray | tee -a "$GITHUB_STEP_SUMMARY"
          file files/usr/bin/xray

      - name: Prepare OpenWrt ${{ env.OPENWRT_VERSION }} source
        run: |
          git clone --depth 1 -b "v$OPENWRT_VERSION" https://github.com/openwrt/openwrt.git src
          cd src
          cp feeds.conf.default feeds.conf
          cat ../openwrt/feeds.conf.extra >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          grep -v '^#' ../openwrt/extra-packages | while read -r name url commit; do
            git clone -q "$url" "package/$name"
            git -C "package/$name" checkout -q "$commit"
          done
          chmod 0755 ../files/etc/init.d/* ../files/usr/bin/* ../files/etc/uci-defaults/*
          {
            echo "OpenWrt $OPENWRT_VERSION + Xray $XRAY_VERSION (slim) + pbr"
            echo "built $(date -u +%F) from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          } > ../files/etc/mr70x-build
          cp -r ../files files
          # all packages any variant may need, for "make download"
          cp ../openwrt/diffconfig .config
          sh ../openwrt/variant.sh config 1 1 1 >> .config
          make defconfig

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: src/dl
          key: dl-${{ env.OPENWRT_VERSION }}-${{ hashFiles('openwrt/**') }}
          restore-keys: dl-${{ env.OPENWRT_VERSION }}-

      - name: Download sources
        working-directory: src
        run: make download -j8 || make download -j1 V=s

      - name: Build variants
        run: |
          SUMMARY=sizes.md openwrt/build-variants.sh src out variants.txt
          { echo "### Прошивки"; cat sizes.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect
        run: |
          cp files/etc/mr70x-build out/BUILDINFO.txt
          (cd out && sha256sum * > sha256sums.txt)
          ls -l out
          {
            echo "OpenWrt $OPENWRT_VERSION для **Mercusys MR70X v1**, собрана из исходников: Xray $XRAY_VERSION (облегчённый: VLESS, Hysteria2, Trojan, Shadowsocks), pbr, подписки на VPN."
            echo
            cat sizes.md
            echo
            echo "- \`*-squashfs-factory.bin\` — прошивка из заводского веб-интерфейса Mercusys;"
            echo "- \`*-squashfs-sysupgrade.bin\` — обновление из OpenWrt (при первой установке — без сохранения настроек)."
            echo
            echo "Какой вариант выбрать и как настроить — в [README](https://github.com/${GITHUB_REPOSITORY}#readme)."
            echo
            echo "⚠️ На реальном устройстве прошивка ещё не проверялась — перед прошивкой прочитайте раздел README про аварийное восстановление."
            echo
            echo '```'
            cat out/BUILDINFO.txt
            echo
            cat out/sha256sums.txt
            echo '```'
          } > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-mr70x
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body_path: release-notes.md
