name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release
        default: '25.12.5'
      xray_version:
        description: Xray-core tag
        default: 'v26.3.27'
      release_tag:
        description: Publish a GitHub release with this tag (e.g. v25.12.5-1), empty = no release
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: ${{ inputs.openwrt_version || '25.12.5' }}
  XRAY_VERSION: ${{ inputs.xray_version || 'v26.3.27' }}
  TARGET: ramips/mt7621
  PROFILE: mercusys_mr70x-v1
  # IMAGE_SIZE of mercusys_mr70x-v1 in target/linux/ramips/image/mt7621.mk
  FIRMWARE_LIMIT: 16121856

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-dev \
            rsync swig unzip zlib1g-dev file wget xsltproc zstd qemu-user-static >/dev/null

      - name: Fetch Xray-core ${{ env.XRAY_VERSION }}
        run: git clone --depth 1 -b "$XRAY_VERSION" https://github.com/XTLS/Xray-core.git xray-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: xray-src/go.mod
          cache-dependency-path: xray-src/go.sum

      - name: Build slim Xray (mipsle softfloat)
        run: |
          set -o pipefail
          bash xray-slim/build.sh "$XRAY_VERSION" files/usr/bin/xray | tee -a "$GITHUB_STEP_SUMMARY"
          file files/usr/bin/xray

      - name: Prepare OpenWrt ${{ env.OPENWRT_VERSION }} source
        run: |
          git clone --depth 1 -b "v$OPENWRT_VERSION" https://github.com/openwrt/openwrt.git src
          cd src
          cp feeds.conf.default feeds.conf
          cat ../openwrt/feeds.conf.extra >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../openwrt/diffconfig .config
          make defconfig
          # make defconfig silently drops options whose dependencies are missing
          for o in CONFIG_TARGET_ramips_mt7621_DEVICE_mercusys_mr70x-v1=y CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024 \
                   CONFIG_PACKAGE_dnsmasq-full=y CONFIG_PACKAGE_pbr=y CONFIG_PACKAGE_kmod-tun=y \
                   CONFIG_PACKAGE_kmod-amneziawg=y CONFIG_PACKAGE_luci-proto-amneziawg=y \
                   CONFIG_PACKAGE_luci-i18n-base-ru=y CONFIG_PACKAGE_ppp-mod-pppoe=y CONFIG_USE_MKLIBS=y; do
            grep -qx "$o" .config || { echo "::error::$o was dropped by make defconfig"; exit 1; }
          done
          chmod 0755 ../files/etc/init.d/* ../files/usr/bin/* ../files/etc/uci-defaults/*
          {
            echo "OpenWrt $OPENWRT_VERSION + Xray $XRAY_VERSION (slim) + pbr + AmneziaWG"
            echo "built $(date -u +%F) from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          } > ../files/etc/mr70x-build
          cp -r ../files files

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: src/dl
          key: dl-${{ env.OPENWRT_VERSION }}-${{ hashFiles('openwrt/**') }}
          restore-keys: dl-${{ env.OPENWRT_VERSION }}-

      - name: Download sources
        working-directory: src
        run: make download -j8 || make download -j1 V=s

      - name: Build firmware
        working-directory: src
        run: |
          if ! make -j"$(nproc)" >build.log 2>&1; then
            tail -50 build.log
            echo "::group::verbose rebuild"
            make -j1 V=s 2>&1 | tail -200
            echo "::endgroup::"
            exit 1
          fi
          tail -5 build.log

      - name: Check size
        run: |
          cd src/bin/targets/$TARGET
          ls -l
          img="$(ls *-squashfs-sysupgrade.bin)"
          size=$(stat -c %s "$img")
          echo "sysupgrade: $size bytes, limit $FIRMWARE_LIMIT, free for overlay: $(( (FIRMWARE_LIMIT - size) / 1024 )) KiB" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$size" -lt "$FIRMWARE_LIMIT" ]

      - name: Check library symbols (mklibs)
        run: tests/check-symbols.sh "$(ls -d src/build_dir/target-*/root-ramips)" "$(ls src/staging_dir/toolchain-*/bin/*-openwrt-linux-nm | head -n1)"

      - name: Smoke test in the built rootfs (qemu chroot)
        run: sudo tests/smoke.sh "$(ls -d src/build_dir/target-*/root-ramips)"

      - name: Collect
        run: |
          mkdir out
          cp src/bin/targets/$TARGET/*-squashfs-*.bin src/bin/targets/$TARGET/*.manifest out/
          cp files/etc/mr70x-build out/BUILDINFO.txt
          (cd out && sha256sum * > sha256sums.txt)
          ls -l out
          {
            echo "OpenWrt $OPENWRT_VERSION для **Mercusys MR70X v1**, собрана из исходников: Xray $XRAY_VERSION (облегчённый), pbr, AmneziaWG."
            echo
            echo "- \`*-squashfs-factory.bin\` — прошивка из заводского веб-интерфейса Mercusys;"
            echo "- \`*-squashfs-sysupgrade.bin\` — обновление из OpenWrt (при первой установке — без сохранения настроек)."
            echo
            echo "После установки: LuCI → Службы → Xray → ссылки \`vless://\`, \`hysteria2://\`, \`trojan://\`, \`ss://\` или подписка. Подробности — в [README](https://github.com/${GITHUB_REPOSITORY}#readme)."
            echo
            echo "⚠️ На реальном устройстве прошивка ещё не проверялась — перед прошивкой прочитайте раздел README про аварийное восстановление."
            echo
            echo '```'
            cat out/BUILDINFO.txt
            echo
            cat out/sha256sums.txt
            echo '```'
          } > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-mr70x-xray
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body_path: release-notes.md
