name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml', 'xray-slim/**']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone xray
        run: git clone --depth 1 -b v26.3.27 https://github.com/XTLS/Xray-core.git xray-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: xray-src/go.mod
          cache: false
      - name: Show API usage
        working-directory: xray-src/infra/conf
        run: |
          grep -n 'API\|Metrics\|commander' xray.go | head -40
          grep -rn 'Hysteria\|hysteria\.' --include=*.go . | grep -v '^./hysteria.go' | grep -v _test | head -40
          grep -n 'type REALITYConfig' -A 30 transport_internet.go | grep json
          grep -n 'type SplitHTTPConfig' -A 30 transport_internet.go | grep json
          sed -n '1,60p' tun.go
          sed -n '1,40p' dokodemo.go
      - name: Build slim
        run: |
          bash xray-slim/build.sh v26.3.27 /tmp/xray 2>&1 | tail -60
